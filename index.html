<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DiklatHub Padang Panjang — Interactive HTML Mockup</title>
<style>
:root{
  --green:#62B946;--green-deep:#247A38;--green-soft:#EAF6E5;--green-pale:#F4FAF1;
  --ink:#263238;--muted:#6B7280;--line:#E5E7EB;--bg:#F7F9F7;--white:#fff;
  --amber:#D18A00;--amber-bg:#FFF6DE;--red:#C84D4D;--red-bg:#FDECEC;--blue:#2F6FED;--blue-bg:#EDF3FF;
  --shadow:0 10px 30px rgba(31,65,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--green-deep)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green-deep)}
.badge.gray{background:#F1F3F5;color:#68717B}
.badge.amber{background:var(--amber-bg);color:#9C6900}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--green);color:white;box-shadow:0 8px 18px rgba(98,185,70,.18)}
.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--green-deep)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:7px 10px;border-radius:8px;font-size:12px}
.btn.block{width:100%}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card.pad{padding:20px}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;color:var(--ink);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:#9BD383;box-shadow:0 0 0 3px rgba(98,185,70,.10)}
.textarea{min-height:92px;resize:vertical}
.field label{display:block;font-size:12px;font-weight:800;margin:0 0 7px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.form-grid .full{grid-column:1/-1}
.sep{height:1px;background:var(--line);margin:18px 0}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:13px 12px;text-align:left;border-bottom:1px solid #EEF1EE;font-size:12px;vertical-align:top}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:900;background:#FBFCFB}
tr:hover td{background:#FCFDFC}
.app{min-height:100vh}
.top-strip{height:4px;background:linear-gradient(90deg,var(--green),#9BCB55)}
.sidebar{position:fixed;left:0;top:4px;bottom:0;width:250px;background:#fff;border-right:1px solid var(--line);padding:18px 14px;overflow:auto;z-index:10}
.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 22px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--green-soft);display:grid;place-items:center;color:var(--green-deep);font-weight:900;font-size:20px}
.brand b{font-size:16px}
.brand small{display:block;color:var(--muted);font-size:10px;line-height:1.35;margin-top:3px}
.nav-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#98A19A;font-weight:900;padding:14px 11px 5px}
.nav-item{width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;text-align:left;color:#55605B;font-size:13px;font-weight:700;margin:2px 0}
.nav-item:hover{background:#F7FAF6}
.nav-item.active{background:var(--green-soft);color:var(--green-deep)}
.nav-icon{width:20px;height:20px;border-radius:6px;background:#F2F5F2;display:grid;place-items:center;font-size:10px;font-weight:900}
.nav-item.active .nav-icon{background:#D9EFD1}
.sidebar-footer{margin-top:24px;border-top:1px solid var(--line);padding:16px 9px 5px}
.portal-switch{display:flex;gap:6px;background:#F2F5F2;border-radius:10px;padding:4px}
.portal-switch button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:10px;font-weight:900;color:var(--muted)}
.portal-switch button.active{background:#fff;color:var(--green-deep);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.main{margin-left:250px;min-height:100vh}
.topbar{height:68px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:8}
.breadcrumb{font-size:12px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:900;color:#68716C;position:relative}
.notify-dot{position:absolute;right:7px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--green);border:2px solid #fff}
.user-pill{display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);display:grid;place-items:center;font-weight:900;font-size:12px}
.user-pill b{font-size:12px;display:block}.user-pill span{font-size:10px;color:var(--muted)}
.content{padding:28px;max-width:1500px;margin:auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}
.page-head h1{font-size:25px;line-height:1.2;margin:2px 0 6px}.page-head p{margin:0;color:var(--muted);font-size:13px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:17px}
.kpi-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;font-weight:800}
.kpi-icon{width:34px;height:34px;border-radius:10px;background:var(--green-pale);display:grid;place-items:center;color:var(--green-deep);font-weight:900}
.kpi-num{font-size:28px;font-weight:900;margin:7px 0 3px;letter-spacing:-.03em}
.kpi-foot{font-size:10px;color:var(--green-deep);font-weight:800}
.grid-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-title h3{margin:0;font-size:15px}.section-title p{margin:4px 0 0;color:var(--muted);font-size:11px}
.link{color:var(--green-deep);font-size:11px;font-weight:900;cursor:pointer}
.activity{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #EEF1EE}
.activity:last-child{border-bottom:0}
.activity-mark{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:4px;box-shadow:0 0 0 5px var(--green-pale)}
.activity b{font-size:11px}.activity p{font-size:10px;color:var(--muted);margin:3px 0 0}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:220px}
.status-step{display:flex;gap:7px;flex-wrap:wrap}
.status-step span{padding:6px 9px;border-radius:8px;background:#F2F4F2;color:#7A827D;font-size:10px;font-weight:900}
.status-step span.current{background:var(--green-soft);color:var(--green-deep)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tab{border:0;background:transparent;padding:10px 13px;font-size:11px;font-weight:900;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--green-deep);border-bottom-color:var(--green)}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.info-box{padding:13px;border:1px solid var(--line);border-radius:12px;background:#FCFDFC}
.info-box small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:900;margin-bottom:5px}
.info-box b{font-size:12px}
.training-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.training-card{padding:17px;display:flex;flex-direction:column;min-height:240px}
.training-card h3{font-size:15px;line-height:1.35;margin:10px 0 8px}
.training-meta{display:grid;gap:6px;margin:7px 0 14px}
.meta-row{display:flex;gap:8px;font-size:11px;color:var(--muted)}
.capacity{margin-top:auto}
.capacity-row{display:flex;justify-content:space-between;font-size:10px;font-weight:800;margin-bottom:6px}
.bar{height:7px;border-radius:99px;background:#EDF0ED;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.training-actions{display:flex;gap:8px;margin-top:14px}
.callout{border:1px solid #CDE6C4;background:var(--green-pale);border-radius:14px;padding:15px}
.callout h4{margin:0 0 5px;font-size:13px}.callout p{margin:0;color:#5F6A62;font-size:11px}
.timeline{display:grid;gap:10px}
.timeline-row{display:grid;grid-template-columns:75px 1fr;gap:10px}
.timeline-row time{font-size:10px;color:var(--muted);font-weight:900;padding-top:2px}
.timeline-row div{font-size:11px}
.cert-card{padding:17px;position:relative;overflow:hidden}
.cert-card:before{content:"";position:absolute;right:-35px;top:-35px;width:110px;height:110px;border-radius:50%;background:var(--green-soft)}
.cert-card h3{margin:8px 0 5px;font-size:14px;position:relative}.cert-card p{font-size:10px;color:var(--muted);position:relative}
.cert-actions{display:flex;gap:7px;margin-top:12px;position:relative}
.profile-header{display:flex;align-items:center;gap:14px}
.profile-avatar{width:68px;height:68px;border-radius:18px;background:var(--green-soft);display:grid;place-items:center;color:var(--green-deep);font-size:20px;font-weight:900}
.faq details{border-bottom:1px solid var(--line);padding:11px 0}.faq summary{font-size:12px;font-weight:900;cursor:pointer}.faq p{font-size:11px;color:var(--muted);line-height:1.55}
.login-page{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:#fff}
.login-hero{background:linear-gradient(140deg,#F4FAF1,#EAF6E5);padding:58px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero-orb{position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(98,185,70,.11);right:-100px;bottom:-80px}
.login-hero h1{font-size:42px;line-height:1.1;margin:20px 0 14px;max-width:620px;letter-spacing:-.04em}
.login-hero p{max-width:620px;color:#5D685F;font-size:15px;line-height:1.65}
.hero-points{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:650px}
.hero-point{padding:14px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:14px}
.hero-point b{font-size:11px;display:block}.hero-point span{font-size:10px;color:var(--muted)}
.login-panel{padding:44px;display:flex;align-items:center;justify-content:center}
.login-box{width:100%;max-width:390px}
.login-box h2{font-size:26px;margin:0 0 7px}.login-box>p{font-size:12px;color:var(--muted);margin:0 0 24px}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.role-card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}
.role-card.active{border-color:#A9D999;background:var(--green-pale)}
.role-card b{font-size:11px;display:block}.role-card span{font-size:9px;color:var(--muted)}
.demo-note{margin-top:18px;padding:12px;border:1px dashed #B6C1B9;border-radius:10px;font-size:10px;color:var(--muted);background:#FAFCFA}
.modal-backdrop{position:fixed;inset:0;background:rgba(24,35,28,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:18px;max-width:820px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 70px rgba(0,0,0,.22)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h2{margin:0;font-size:18px}.modal-head p{margin:5px 0 0;font-size:11px;color:var(--muted)}
.modal-body{padding:20px}
.close-btn{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:9px;font-size:16px}
.toast{position:fixed;right:22px;bottom:22px;background:#1F3D28;color:#fff;border-radius:12px;padding:12px 15px;box-shadow:0 14px 40px rgba(0,0,0,.22);font-size:12px;font-weight:800;transform:translateY(120px);opacity:0;transition:.25s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
.cert-preview{border:12px solid #F0F6ED;outline:1px solid #B9D6AF;padding:44px 34px;text-align:center;background:#fff;position:relative;min-height:520px}
.cert-preview:before,.cert-preview:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--green-pale)}
.cert-preview:before{left:-35px;top:-35px}.cert-preview:after{right:-35px;bottom:-35px}
.cert-preview h1{font-family:Georgia,serif;letter-spacing:.08em;font-size:34px;color:var(--green-deep);margin:22px 0 14px}
.cert-preview h2{font-size:24px;margin:16px 0}.cert-preview .cert-no{font-size:11px;font-weight:900}
.qr{width:82px;height:82px;margin:15px auto 0;background:
linear-gradient(90deg,#1d2b20 10px,transparent 10px) 0 0/20px 20px,
linear-gradient(#1d2b20 10px,transparent 10px) 0 0/20px 20px,
linear-gradient(90deg,transparent 10px,#1d2b20 10px) 10px 10px/20px 20px,
linear-gradient(transparent 10px,#1d2b20 10px) 10px 10px/20px 20px;
border:7px solid white;outline:1px solid #D9DDD9}
.verify-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--green-pale)}
.verify-card{max-width:620px;width:100%;padding:26px}
.verify-status{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--green-soft);color:var(--green-deep);font-weight:900;margin:18px 0}
.empty{padding:36px;text-align:center;color:var(--muted)}
.mobile-menu{display:none}
@media(max-width:1100px){
 .kpi-grid{grid-template-columns:repeat(2,1fr)}
 .training-cards,.grid-3{grid-template-columns:repeat(2,1fr)}
 .info-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
 .sidebar{transform:translateX(-100%);transition:.2s;box-shadow:8px 0 30px rgba(0,0,0,.08)}
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0}
 .mobile-menu{display:grid}
 .login-page{grid-template-columns:1fr}.login-hero{display:none}.login-panel{padding:24px;min-height:100vh}
 .grid-2,.training-cards,.grid-3,.info-grid{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}
 .topbar{padding:0 16px}.content{padding:18px}.user-pill div:not(.avatar){display:none}
}
@media(max-width:520px){
 .kpi-grid{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px}.kpi-num{font-size:22px}
 .page-head{flex-direction:column}.page-head .btn{width:100%}
 .toolbar>*{width:100%!important}
 .training-actions{flex-direction:column}.training-actions .btn{width:100%}
}
@media print{
 body *{visibility:hidden}
 .printable,.printable *{visibility:visible}
 .printable{position:absolute;left:0;top:0;width:100%}
 .cert-preview{outline:none;border:6px solid #dfeadb}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal-backdrop" onclick="if(event.target===this) closeModal()"></div>
<div id="toast" class="toast"></div>

<script>
const state = {
  loggedIn:false,
  portal:'admin',
  page:'dashboard',
  teacherPage:'teacher-dashboard',
  activeTrainingId:1,
  activeTrainingTab:'overview',
  loginRole:'admin',
  attendanceOpen:false,
  certificateIssued:true,
  user:{name:'Siti Rahma, S.Pd.',school:'SMPN 1 Padang Panjang',nip:'198709122010012004',position:'Guru Mata Pelajaran',email:'guru@diklathub.local',phone:'0812-3456-7890'},
  trainings:[
    {id:1,title:'Penyusunan Modul Ajar Berbasis Kurikulum Merdeka',category:'Pedagogik',date:'25 Okt 2026',start:'08.00',end:'16.00',location:'Aula Dinas Pendidikan',mode:'Offline',quota:50,participants:47,status:'REGISTRATION_OPEN',speaker:'Dr. Rina Yusnita, M.Pd.',institution:'Universitas Negeri Padang',jp:8,desc:'Pelatihan praktis untuk membantu guru menyusun modul ajar yang kontekstual, terstruktur, dan selaras dengan Kurikulum Merdeka.',requirements:'Guru SD/SMP, membawa laptop dan perangkat pembelajaran.'},
    {id:2,title:'Pemanfaatan AI untuk Pembelajaran',category:'Teknologi',date:'31 Okt 2026',start:'08.00',end:'15.00',location:'SMPN 1 Padang Panjang',mode:'Offline',quota:50,participants:42,status:'REGISTRATION_OPEN',speaker:'Fajar Ramadhan, M.Kom.',institution:'Praktisi EdTech',jp:7,desc:'Pengenalan pemanfaatan AI secara aman dan praktis untuk perencanaan, materi, asesmen, dan produktivitas guru.',requirements:'Guru SD/SMP, memiliki akun email aktif dan membawa laptop.'},
    {id:3,title:'Asesmen Pembelajaran yang Bermakna',category:'Evaluasi',date:'8 Nov 2026',start:'08.30',end:'15.30',location:'Aula Dinas Pendidikan',mode:'Hybrid',quota:40,participants:38,status:'REGISTRATION_OPEN',speaker:'Dr. Yuni Pratiwi, M.Pd.',institution:'Pengawas Sekolah',jp:7,desc:'Mengembangkan asesmen diagnostik, formatif, dan sumatif yang relevan serta mudah diterapkan.',requirements:'Guru dan tenaga kependidikan terkait.'},
    {id:4,title:'Literasi Digital untuk Guru',category:'Teknologi',date:'12 Sep 2026',start:'08.00',end:'16.00',location:'Aula Dinas Pendidikan',mode:'Offline',quota:60,participants:58,status:'COMPLETED',speaker:'Arief Setiawan, M.T.',institution:'Dinas Kominfo',jp:8,desc:'Pelatihan literasi digital dan keamanan dasar untuk guru.',requirements:'Guru semua jenjang.'}
  ],
  registrations:[
    {id:101,trainingId:4,name:'Siti Rahma, S.Pd.',school:'SMPN 1 Padang Panjang',status:'APPROVED',attendance:'PRESENT'},
    {id:102,trainingId:1,name:'Siti Rahma, S.Pd.',school:'SMPN 1 Padang Panjang',status:'APPROVED',attendance:null},
    {id:103,trainingId:1,name:'Rizki Pratama, S.Pd.',school:'SMPN 2 Padang Panjang',status:'APPROVED',attendance:'PRESENT'},
    {id:104,trainingId:1,name:'Yuliana, S.Pd.',school:'SDN 03 Padang Panjang',status:'PENDING_APPROVAL',attendance:null},
  ],
  certificates:[
    {id:201,trainingId:4,title:'Literasi Digital untuk Guru',date:'12 Sep 2026',number:'421.5/00017/DISDIK/2026',status:'PUBLISHED',name:'Siti Rahma, S.Pd.',nip:'198709122010012004',jp:8}
  ]
};

const icons = {
 dashboard:'⌂', training:'▣', participants:'♙', attendance:'✓', certificate:'◇', teacher:'♟', report:'▥', settings:'⚙',
 catalogue:'⌕', mytraining:'◎', profile:'◉', help:'?', logout:'↪'
};

function fmtStatus(s){
 const map={
  REGISTRATION_OPEN:['Pendaftaran','green'],REGISTRATION_CLOSED:['Ditutup','gray'],ONGOING:['Berlangsung','blue'],COMPLETED:['Selesai','gray'],
  DRAFT:['Draft','gray'],APPROVED:['Disetujui','green'],PENDING_APPROVAL:['Menunggu','amber'],REJECTED:['Ditolak','red'],
  PRESENT:['Hadir','green'],ABSENT:['Tidak Hadir','red'],PUBLISHED:['Terbit','green'],REVOKED:['Dicabut','red']
 };
 const m=map[s]||[s,'gray'];
 return `<span class="badge ${m[1]}"><span class="dot"></span>${m[0]}</span>`;
}

function trainingById(id){return state.trainings.find(t=>t.id===Number(id))}
function myRegistration(trainingId){return state.registrations.find(r=>r.trainingId===Number(trainingId)&&r.name===state.user.name)}

function toast(msg){
 const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
 setTimeout(()=>el.classList.remove('show'),2400);
}

function openModal(html){
 const m=document.getElementById('modal');m.innerHTML=`<div class="modal">${html}</div>`;m.classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show')}

function login(){
 state.loggedIn=true;
 state.portal=state.loginRole==='teacher'?'teacher':'admin';
 render();
 toast(state.portal==='admin'?'Berhasil masuk sebagai Admin Dinas':'Berhasil masuk sebagai Guru/Tendik');
}

function logout(){state.loggedIn=false;render()}

function setPortal(p){state.portal=p;render()}

function saveNewTraining(){
 const title=document.getElementById('newTitle').value||'Pelatihan Baru';
 const quota=Number(document.getElementById('newQuota').value||50);
 const id=Math.max(...state.trainings.map(t=>t.id))+1;
 state.trainings.unshift({id,title,category:'Pedagogik',date:'15 Nov 2026',start:'08.00',end:'16.00',location:'Aula Dinas Pendidikan',mode:'Offline',quota,participants:0,status:'REGISTRATION_OPEN',speaker:'Belum ditentukan',institution:'-',jp:8,desc:'Deskripsi pelatihan baru.',requirements:'Guru/Tendik sesuai target pelatihan.'});
 closeModal();toast('Pelatihan berhasil dipublikasikan');state.page='trainings';render();
}

function trainingDetail(){
 const t=trainingById(state.activeTrainingId);
 const tabs=[['overview','Overview'],['participants','Peserta'],['attendance','Absensi'],['certificates','Sertifikat'],['report','Laporan']];
 let body='';
 if(state.activeTrainingTab==='overview') body=trainingOverview(t);
 if(state.activeTrainingTab==='participants') body=trainingParticipants(t);
 if(state.activeTrainingTab==='attendance') body=trainingAttendance(t);
 if(state.activeTrainingTab==='certificates') body=trainingCertificates(t);
 if(state.activeTrainingTab==='report') body=trainingReport(t);
 return shell(`
  <div class="page-head"><div><div class="eyebrow">${t.category}</div><h1>${t.title}</h1><p>${t.date} • ${t.start}–${t.end} WIB • ${t.location}</p><div style="margin-top:9px">${fmtStatus(t.status)}</div></div>
   <div style="display:flex;gap:8px"><button class="btn secondary" onclick="toast('Mode edit dibuka')">Edit</button>${t.status!=='COMPLETED'?`<button class="btn primary" onclick="completeTraining(${t.id})">Tandai Selesai</button>`:''}</div></div>
  <div class="card pad">
   <div class="status-step"><span>Draft</span><span class="${t.status==='REGISTRATION_OPEN'?'current':''}">Pendaftaran</span><span class="${t.status==='ONGOING'?'current':''}">Berlangsung</span><span class="${t.status==='COMPLETED'?'current':''}">Selesai</span></div>
   <div class="tabs" style="margin-top:18px">${tabs.map(x=>`<button class="tab ${state.activeTrainingTab===x[0]?'active':''}" onclick="setTrainingTab('${x[0]}')">${x[1]}</button>`).join('')}</div>
   ${body}
  </div>`, 'Detail Pelatihan');
}

function info(a,b){return `<div class="info-box"><small>${a}</small><b>${b}</b></div>`}

function trainingParticipants(t){
 const regs=state.registrations.filter(r=>r.trainingId===t.id);
 const rows=regs.length?regs.map(r=>`<tr><td><b>${r.name}</b></td><td>${r.school}</td><td>${fmtStatus(r.status)}</td><td>${r.attendance?fmtStatus(r.attendance):'<span class="muted">Belum ada</span>'}</td><td>${r.status==='PENDING_APPROVAL'?`<button class="btn primary sm" onclick="approveRegistration(${r.id})">Approve</button>`:'<button class="btn secondary sm">Detail</button>'}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">Belum ada peserta.</div></td></tr>`;
 return `<div class="toolbar"><input class="input grow" placeholder="Cari nama/NIP/sekolah..."/><select class="select" style="width:190px"><option>Semua Status</option><option>Approved</option><option>Pending</option></select><button class="btn secondary">Export Excel</button></div>
 <div class="table-wrap"><table><thead><tr><th>Nama</th><th>Sekolah</th><th>Pendaftaran</th><th>Kehadiran</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function approveRegistration(id){const r=state.registrations.find(x=>x.id===id);r.status='APPROVED';toast('Peserta disetujui');render()}

function trainingAttendance(t){
 const regs=state.registrations.filter(r=>r.trainingId===t.id&&r.status==='APPROVED');
 return `<div class="grid-2">
 <div>
  <div class="callout">
   <div class="eyebrow">Sesi Absensi</div>
   <h4 style="margin-top:8px">${state.attendanceOpen?'Absensi sedang dibuka':'Absensi belum dibuka'}</h4>
   <p>${state.attendanceOpen?'Guru yang terdaftar dapat scan QR untuk check-in.':'Buka sesi pada saat pelatihan berlangsung.'}</p>
   <div style="display:flex;gap:8px;margin-top:13px">${!state.attendanceOpen?`<button class="btn primary" onclick="state.attendanceOpen=true;toast('Sesi absensi dibuka');render()">Buka Absensi</button>`:`<button class="btn secondary" onclick="showQR()">Tampilkan QR</button><button class="btn danger" onclick="state.attendanceOpen=false;toast('Sesi absensi ditutup');render()">Tutup</button>`}</div>
  </div>
 </div>
 <div>
  <div class="info-grid" style="grid-template-columns:repeat(2,1fr)">${info('Peserta Approved',regs.length)}${info('Sudah Hadir',regs.filter(x=>x.attendance==='PRESENT').length)}</div>
 </div></div>
 <div class="sep"></div>
 <div class="table-wrap"><table><thead><tr><th>Peserta</th><th>Sekolah</th><th>Check-in</th><th>Status</th><th></th></tr></thead><tbody>
 ${regs.map(r=>`<tr><td><b>${r.name}</b></td><td>${r.school}</td><td>${r.attendance==='PRESENT'?'08:14 WIB':'—'}</td><td>${r.attendance?fmtStatus(r.attendance):'<span class="badge gray">Belum Absen</span>'}</td><td><button class="btn secondary sm" onclick="correctAttendance(${r.id})">Koreksi</button></td></tr>`).join('')}
 </tbody></table></div>`;
}
function showQR(){openModal(`<div class="modal-head"><div><h2>QR Absensi</h2><p>Peserta scan QR ini menggunakan akun DiklatHub.</p></div><button class="close-btn" onclick="closeModal()">×</button></div><div class="modal-body" style="text-align:center"><div class="qr" style="width:220px;height:220px;background-size:40px 40px;border-width:14px"></div><h3>Absensi ${trainingById(state.activeTrainingId).title}</h3><p class="muted small">Token aktif selama sesi absensi dibuka.</p></div>`)}
function correctAttendance(id){const r=state.registrations.find(x=>x.id===id);r.attendance=r.attendance==='PRESENT'?'ABSENT':'PRESENT';toast('Koreksi absensi disimpan dan dicatat di audit log');render()}

function trainingCertificates(t){
 const regs=state.registrations.filter(r=>r.trainingId===t.id);
 const eligible=regs.filter(r=>r.status==='APPROVED'&&r.attendance==='PRESENT');
 const certs=state.certificates.filter(c=>c.trainingId===t.id);
 return `<div class="kpi-grid">${kpi('Eligible',eligible.length,'Memenuhi rule','✓')}${kpi('Generated',certs.length,'PDF dibuat','◇')}${kpi('Published',certs.filter(c=>c.status==='PUBLISHED').length,'Tersedia bagi guru','↗')}${kpi('Revoked',certs.filter(c=>c.status==='REVOKED').length,'Tidak valid','!')}</div>
 <div class="callout"><h4>Certificate Automation</h4><p>Untuk pelatihan yang selesai, peserta Approved + Hadir akan otomatis mendapatkan nomor, PDF, dan QR verifikasi. Admin hanya melakukan review, reissue, atau revoke bila diperlukan.</p></div>
 <div class="sep"></div>
 <div class="table-wrap"><table><thead><tr><th>Peserta</th><th>Attendance</th><th>Eligibility</th><th>No. Sertifikat</th><th>Status</th><th></th></tr></thead><tbody>
 ${regs.map(r=>{const c=certs.find(c=>c.name===r.name);const ok=r.status==='APPROVED'&&r.attendance==='PRESENT'&&t.status==='COMPLETED';return `<tr><td><b>${r.name}</b></td><td>${r.attendance?fmtStatus(r.attendance):'<span class="muted">—</span>'}</td><td>${ok?'<span class="badge green">Eligible</span>':'<span class="badge gray">Belum Eligible</span>'}</td><td>${c?c.number:'—'}</td><td>${c?fmtStatus(c.status):'<span class="muted">Pending</span>'}</td><td>${c?`<button class="btn secondary sm" onclick="viewCertificate(${c.id})">Lihat</button>`:'—'}</td></tr>`}).join('')}
 </tbody></table></div>`;
}

function completeTraining(id){
 const t=trainingById(id);t.status='COMPLETED';
 const regs=state.registrations.filter(r=>r.trainingId===id&&r.status==='APPROVED'&&r.attendance==='PRESENT');
 regs.forEach((r,i)=>{
  if(!state.certificates.find(c=>c.trainingId===id&&c.name===r.name)){
   state.certificates.push({id:Date.now()+i,trainingId:id,title:t.title,date:t.date,number:`421.5/${String(20+state.certificates.length+i).padStart(5,'0')}/DISDIK/2026`,status:'PUBLISHED',name:r.name,nip:r.name===state.user.name?state.user.nip:'1988XXXXXXXXXXXX',jp:t.jp});
  }
 });
 toast(`Pelatihan selesai. ${regs.length} sertifikat otomatis diterbitkan.`);
 render();
}

function trainingReport(t){
 return `<div class="kpi-grid">${kpi('Kuota',t.quota,'Kapasitas','♙')}${kpi('Pendaftar',t.participants,'Total registrasi','▣')}${kpi('Hadir',state.registrations.filter(r=>r.trainingId===t.id&&r.attendance==='PRESENT').length,'Attendance','✓')}${kpi('Sertifikat',state.certificates.filter(c=>c.trainingId===t.id).length,'Terbit','◇')}</div>
 <div class="callout"><h4>Export Laporan Pelatihan</h4><p>Rekap peserta, absensi, dan sertifikat dapat diekspor untuk kebutuhan administrasi Dinas.</p><div style="margin-top:12px;display:flex;gap:8px"><button class="btn secondary">Export Peserta</button><button class="btn secondary">Export Absensi</button><button class="btn secondary">Export Sertifikat</button></div></div>`;
}

function render(){
 const root=document.getElementById('root');
 if(!state.loggedIn){root.innerHTML=loginView();return}
 if(state.portal==='admin'){
  const p=state.page;
  if(p==='dashboard')root.innerHTML=adminDashboard();
  else if(p==='trainings')root.innerHTML=adminTrainings();
  else if(p==='training-detail')root.innerHTML=trainingDetail();
  else if(['participants','attendance','certificates'].includes(p))root.innerHTML=genericTablePage(p);
  else if(p==='teachers')root.innerHTML=teachersPage();
  else if(p==='reports')root.innerHTML=reportsPage();
  else if(p==='settings')root.innerHTML=settingsPage();
 } else {
  const p=state.teacherPage;
  if(p==='teacher-dashboard')root.innerHTML=teacherDashboard();
  else if(p==='catalogue')root.innerHTML=teacherCatalogue();
  else if(p==='my-trainings')root.innerHTML=myTrainings();
  else if(p==='my-certificates')root.innerHTML=teacherCertificates();
  else if(p==='profile')root.innerHTML=profilePage();
  else if(p==='help')root.innerHTML=helpPage();
 }
 window.scrollTo({top:0});
}
render();
</script>
